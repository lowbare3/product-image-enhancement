<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Photo Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --accent: #2563eb; --accent-text: #fff;
    --ok: #16a34a; --err: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  label small { font-weight: 400; color: var(--muted); }
  select, input[type=text], input[type=password], textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 60px; }
  button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--text); }
  button:hover:not(:disabled) { border-color: #a8a29e; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .drop { border: 2px dashed #d6d3d1; border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); cursor: pointer; background: var(--panel); }
  .drop.over { border-color: var(--accent); background: #eff6ff; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
  .toolbar .spacer { flex: 1; }
  .grid { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: auto; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #f5f5f4; color: var(--muted); white-space: nowrap; }
  .status.done { background: #dcfce7; color: var(--ok); }
  .status.error { background: #fee2e2; color: var(--err); }
  .status.working { background: #fef3c7; color: var(--warn); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pair figure { margin: 0; }
  .pair figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .imgbox { aspect-ratio: 1; background: repeating-conic-gradient(#f0f0f0 0 25%, #fafafa 0 50%) 0 0/16px 16px; border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .imgbox img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  .imgbox .placeholder { color: var(--muted); font-size: 12px; padding: 10px; text-align: center; }
  .card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card-actions input { flex: 1; min-width: 140px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  .note.err { color: var(--err); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .spinner { width: 22px; height: 22px; border: 3px solid #e7e5e4; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
  #lightbox img { max-width: 95vw; max-height: 95vh; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
</style>
</head>
<body>
<header>
  <h1>Product Photo Studio</h1>
  <div class="row" style="flex: 0 1 520px">
    <input type="password" id="apiKey" placeholder="Gemini API key" autocomplete="off">
    <label style="margin:0; font-weight:400; flex:0 0 auto; display:flex; gap:4px; align-items:center"><input type="checkbox" id="rememberKey"> Remember</label>
  </div>
</header>

<div class="layout">
  <aside class="panel">
    <h2>Settings</h2>

    <label>Model</label>
    <div class="row">
      <select id="model">
        <option value="gemini-2.5-flash-image">gemini-2.5-flash-image (fast, cheap)</option>
        <option value="gemini-3-pro-image-preview">gemini-3-pro-image-preview (higher fidelity)</option>
      </select>
      <button id="loadModels" style="flex:0 0 auto" title="Fetch image models available to your key">↻</button>
    </div>
    <div class="hint">↻ lists the image models your key can use.</div>

    <label>Product type</label>
    <select id="productType">
      <option value="general">General product</option>
      <option value="apparel">Clothing / apparel</option>
      <option value="jewellery">Jewellery / accessories</option>
      <option value="footwear">Footwear</option>
      <option value="beauty">Beauty / cosmetics / bottles</option>
      <option value="electronics">Electronics / gadgets</option>
      <option value="home">Home / kitchen</option>
    </select>

    <label>Presentation</label>
    <select id="presentation">
      <option value="keep">Keep angle, just remove hand / hanger</option>
      <option value="standing">Standing upright on surface</option>
      <option value="ghost">Ghost mannequin (apparel)</option>
      <option value="flatlay">Flat lay from above</option>
    </select>
    <div class="hint" id="presentationHint"></div>

    <label>Background</label>
    <select id="background">
      <option value="white">Pure white (#FFFFFF) – marketplace</option>
      <option value="lightgrey">Light grey seamless</option>
      <option value="beige">Warm beige seamless</option>
      <option value="clean">Keep original setting, just tidy it</option>
    </select>

    <label>Shadow</label>
    <select id="shadow">
      <option value="soft">Soft natural contact shadow</option>
      <option value="none">No shadow</option>
    </select>

    <label>Aspect ratio</label>
    <select id="aspect">
      <option value="1:1">1:1 square</option>
      <option value="3:4">3:4 portrait</option>
      <option value="4:5">4:5 portrait</option>
      <option value="9:16">9:16 story</option>
      <option value="">Same as input</option>
    </select>

    <label>Extra instructions <small>(optional, applies to all)</small></label>
    <textarea id="extra" placeholder="e.g. remove the price sticker; straighten the collar"></textarea>

    <details>
      <summary>Output & realism</summary>
      <label>Film grain <small id="grainVal">2</small></label>
      <input type="range" id="grain" min="0" max="8" step="1" value="2" style="width:100%">
      <div class="hint">Tiny bit of sensor noise takes away the "too smooth" AI look. 0 = off.</div>

      <label>Export size (long side, px)</label>
      <select id="exportSize">
        <option value="0">As generated</option>
        <option value="1000">1000</option>
        <option value="1500">1500</option>
        <option value="2000" selected>2000</option>
      </select>

      <label>JPEG quality</label>
      <select id="quality">
        <option value="0.85">85%</option>
        <option value="0.92" selected>92%</option>
        <option value="0.97">97%</option>
      </select>

      <label>Parallel requests</label>
      <select id="concurrency">
        <option>1</option><option selected>2</option><option>3</option><option>4</option>
      </select>
    </details>

    <details>
      <summary>Preview prompt</summary>
      <textarea id="promptPreview" readonly style="min-height:260px; font-size:12px; margin-top:8px"></textarea>
    </details>
  </aside>

  <main>
    <div class="drop" id="drop">
      <strong>Drop product photos here</strong> or click to choose<br>
      <span class="hint">JPG / PNG / WEBP / HEIC-converted. Multiple files OK.</span>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>

    <div class="toolbar">
      <button class="primary" id="runAll">Enhance all</button>
      <button id="downloadAll">Download all (.zip)</button>
      <button id="clearAll">Clear</button>
      <span class="spacer"></span>
      <span class="hint" id="summary"></span>
    </div>

    <div class="grid" id="list"><div class="empty">No images yet.</div></div>
  </main>
</div>

<div id="lightbox"><img alt=""></div>

<script>
const $ = (id) => document.getElementById(id);
const API = 'https://generativelanguage.googleapis.com/v1beta';
const MAX_INPUT_SIDE = 2048;

const items = []; // { id, file, name, srcDataUrl, srcBase64, mime, w, h, status, rawResult, finalUrl, note, error }
let nextId = 1;

/* ---------- settings persistence ---------- */
const SETTINGS = ['model','productType','presentation','background','shadow','aspect','extra','grain','exportSize','quality','concurrency'];
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }

(function restore() {
  const key = safeGet('pps_key');
  if (key) { $('apiKey').value = key; $('rememberKey').checked = true; }
  const s = JSON.parse(safeGet('pps_settings') || '{}');
  for (const k of SETTINGS) if (s[k] != null) {
    const el = $(k);
    if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === s[k])) el.add(new Option(s[k], s[k]));
    el.value = s[k];
  }
  $('grainVal').textContent = $('grain').value;
})();

function saveSettings() {
  const s = {}; for (const k of SETTINGS) s[k] = $(k).value;
  safeSet('pps_settings', JSON.stringify(s));
  updatePromptPreview();
  updatePresentationHint();
}
SETTINGS.forEach(k => $(k).addEventListener('change', saveSettings));
$('extra').addEventListener('input', saveSettings);
$('grain').addEventListener('input', () => { $('grainVal').textContent = $('grain').value; });
$('grain').addEventListener('change', () => { saveSettings(); reprocessAll(); });
$('apiKey').addEventListener('input', () => { if ($('rememberKey').checked) safeSet('pps_key', $('apiKey').value); });
$('rememberKey').addEventListener('change', () => safeSet('pps_key', $('rememberKey').checked ? $('apiKey').value : null));

function updatePresentationHint() {
  const h = {
    keep: 'Safest. Least change = least risk of AI look.',
    standing: 'Moderate change. Good for bottles, boxes, shoes, bags.',
    ghost: 'Big change. Check neckline/sleeves carefully.',
    flatlay: 'Big change. Model must re-imagine the item lying flat.',
  }[$('presentation').value];
  $('presentationHint').textContent = h || '';
}

/* ---------- prompt ---------- */
function buildPrompt() {
  const type = $('productType').value;
  const pres = $('presentation').value;
  const bg = $('background').value;
  const shadow = $('shadow').value;
  const extra = $('extra').value.trim();

  const typeNotes = {
    general: '',
    apparel: 'This is a clothing item. Preserve the exact fabric texture, weave, knit, print scale, embroidery, buttons, zips, seams and stitching. Keep natural, light fabric drape; do not make it look stiff or plastic.',
    jewellery: 'This is jewellery / an accessory. Preserve the exact metal colour, stone colours and cut, chain links, engravings and clasp. Keep realistic metallic reflections; do not add sparkles, glints or glow.',
    footwear: 'This is footwear. Preserve the exact sole, stitching, laces, materials (leather grain, mesh, suede) and branding.',
    beauty: 'This is a beauty / cosmetic product. Every word on the label must stay exactly as in the original, letter for letter. Preserve the cap, bottle shape, liquid colour and transparency.',
    electronics: 'This is an electronic product. Preserve exact ports, buttons, screen, logos and printed text. Keep realistic material finish (matte vs glossy).',
    home: 'This is a home / kitchen product. Preserve exact shape, material finish, patterns and any printed text.',
  }[type];

  const presText = {
    keep: 'Keep the product at its current angle, orientation and shape. Only remove what is holding or supporting it.',
    standing: 'Show the product standing naturally upright on the surface, in a straight-on catalog view, as close to the original viewing angle as possible.',
    ghost: 'Present the garment as a professional "ghost mannequin" (invisible mannequin) catalog shot: shaped as if worn by an invisible body, front view, symmetric and neatly presented, with the inside back of the neckline visible. No mannequin, body or hanger visible.',
    flatlay: 'Present the product as a neat flat lay photographed from directly above, arranged naturally and neatly (for clothing: smoothly laid out with sleeves placed naturally).',
  }[pres];

  const bgText = {
    white: 'Background: pure seamless white (#FFFFFF), evenly lit, no gradient, no texture, no props.',
    lightgrey: 'Background: a light neutral grey seamless studio backdrop (around #EDEDED), evenly lit, no props.',
    beige: 'Background: a warm, soft beige seamless studio backdrop, evenly lit, no props.',
    clean: 'Background: keep the original setting but tidy it — remove clutter, distractions, and anything unrelated to the product. Keep it plausible and photographic.',
  }[bg];

  const shadowText = shadow === 'soft'
    ? 'Add a soft, natural contact shadow directly beneath / behind the product so it sits grounded on the surface, consistent with the studio light direction. No hard drop shadows, no reflections.'
    : 'No shadow; the product sits cleanly on the background.';

  return [
`You are a professional e-commerce product photographer and retoucher. Edit the provided photo into a clean, catalog-ready product photo.`,
``,
`PRODUCT FIDELITY (most important):`,
`- The product must remain EXACTLY the same item: same shape, proportions, colours, material, texture, pattern, print, logos, labels and text.`,
`- Do not redesign, beautify, smooth, recolour or "upgrade" the product. Do not add or remove any part of it (buttons, straps, tags, pockets, patterns).`,
`- Any text or logo on the product must be reproduced exactly; if unsure, keep the original pixels.`,
typeNotes ? `- ${typeNotes}` : null,
``,
`EDIT:`,
`- Remove every hand, finger, arm, person, hanger, hook, clip, pin, stand, string, price sticker and any other object that is not part of the product. Where these covered the product, reconstruct the hidden area so it is consistent with the visible parts of the same product.`,
`- ${presText}`,
`- ${bgText}`,
`- ${shadowText}`,
`- Lighting: soft, even, diffused studio lighting (large softboxes). Neutral, accurate white balance with true-to-life colours. Correct any colour cast, under/over exposure and blur from the original phone photo.`,
`- Composition: product centred, filling about 80–85% of the frame with even margins, nothing cropped off.`,
extra ? `- Additional instructions: ${extra}` : null,
``,
`REALISM:`,
`- The result must look like a real photograph taken with a professional camera in a studio — not a 3D render, illustration or AI image.`,
`- Avoid: plastic or waxy surfaces, over-sharpening, HDR look, glow/bloom, oversaturated colours, perfectly symmetric idealisation, invented details.`,
`- Keep natural material character (fabric weave, slight natural creases, real reflections) and natural depth of field.`,
``,
`Return only the edited image.`,
  ].filter(l => l !== null).join('\n');
}
function updatePromptPreview() { $('promptPreview').value = buildPrompt(); }
updatePromptPreview(); updatePresentationHint();

/* ---------- model list ---------- */
$('loadModels').addEventListener('click', async () => {
  const key = $('apiKey').value.trim();
  if (!key) return alert('Enter your API key first.');
  $('loadModels').disabled = true;
  try {
    let models = [], pageToken = '';
    do {
      const r = await fetch(`${API}/models?pageSize=1000${pageToken ? '&pageToken=' + pageToken : ''}`, { headers: { 'x-goog-api-key': key } });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || r.statusText);
      models.push(...(j.models || []));
      pageToken = j.nextPageToken || '';
    } while (pageToken);
    const img = models.filter(m => /image/i.test(m.name) && !/imagen/i.test(m.name)
      && (m.supportedGenerationMethods || []).includes('generateContent'));
    if (!img.length) return alert('No Gemini image models found for this key.');
    const sel = $('model'), cur = sel.value;
    sel.innerHTML = '';
    for (const m of img) { const id = m.name.replace('models/', ''); sel.add(new Option(`${id}${m.displayName ? ' – ' + m.displayName : ''}`, id)); }
    if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
    saveSettings();
  } catch (e) { alert('Could not list models: ' + e.message); }
  finally { $('loadModels').disabled = false; }
});

/* ---------- file intake ---------- */
const drop = $('drop');
drop.addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
document.addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith('image/'));
  if (files.length) addFiles(files);
});

function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

async function addFiles(fileList) {
  for (const file of fileList) {
    if (!file.type.startsWith('image/')) continue;
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      // Downscale large phone photos; keeps request small and fast without hurting quality.
      const scale = Math.min(1, MAX_INPUT_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL('image/jpeg', 0.92);
      items.push({ id: nextId++, name: file.name.replace(/\.[^.]+$/, ''), srcDataUrl: dataUrl,
        srcBase64: dataUrl.split(',')[1], mime: 'image/jpeg', w: c.width, h: c.height, status: 'ready' });
    } catch { alert('Could not read ' + file.name + ' (HEIC? convert to JPG first).'); }
    finally { URL.revokeObjectURL(url); }
  }
  render();
}

/* ---------- Gemini call ---------- */
async function callGemini(parts) {
  const key = $('apiKey').value.trim();
  if (!key) throw new Error('Enter your Gemini API key at the top.');
  const generationConfig = { responseModalities: ['TEXT', 'IMAGE'] };
  const aspect = $('aspect').value;
  if (aspect) generationConfig.imageConfig = { aspectRatio: aspect };

  const r = await fetch(`${API}/models/${encodeURIComponent($('model').value)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || `HTTP ${r.status}`);

  const cand = j.candidates?.[0];
  const outParts = cand?.content?.parts || [];
  const imgPart = outParts.find(p => (p.inlineData || p.inline_data)?.data);
  const text = outParts.filter(p => p.text).map(p => p.text).join('\n').trim();
  if (!imgPart) {
    const reason = cand?.finishReason || j.promptFeedback?.blockReason || 'no image returned';
    throw new Error(`Model returned no image (${reason}).${text ? '\n' + text : ''}`);
  }
  const d = imgPart.inlineData || imgPart.inline_data;
  return { dataUrl: `data:${d.mimeType || d.mime_type || 'image/png'};base64,${d.data}`, text };
}

async function enhance(item, refineText) {
  item.status = 'working'; item.error = null; render();
  try {
    let parts;
    if (refineText && item.rawResult) {
      parts = [
        { text: 'Image 1 is the ORIGINAL product photo (ground truth for what the product looks like). Image 2 is the current edited catalog photo.' },
        { inline_data: { mime_type: item.mime, data: item.srcBase64 } },
        { inline_data: { mime_type: item.rawResult.split(';')[0].slice(5), data: item.rawResult.split(',')[1] } },
        { text: `Edit image 2 with this change: ${refineText}\nChange nothing else. The product must still match image 1 exactly (shape, colours, texture, text, logos). Keep it looking like a real studio photograph, not AI-generated. Return only the edited image.` },
      ];
    } else {
      parts = [ { text: buildPrompt() }, { inline_data: { mime_type: item.mime, data: item.srcBase64 } } ];
    }
    const { dataUrl, text } = await callGemini(parts);
    item.rawResult = dataUrl;
    item.note = text || '';
    item.finalUrl = await postProcess(dataUrl);
    item.status = 'done';
  } catch (e) {
    item.status = 'error'; item.error = e.message;
  }
  render();
}

/* ---------- post-processing: resize + subtle grain, export JPEG ---------- */
async function postProcess(dataUrl) {
  const img = await loadImage(dataUrl);
  const target = +$('exportSize').value;
  const scale = target ? target / Math.max(img.naturalWidth, img.naturalHeight) : 1;
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);

  const grain = +$('grain').value;
  if (grain > 0) {
    const id = ctx.getImageData(0, 0, c.width, c.height), px = id.data;
    for (let i = 0; i < px.length; i += 4) {
      // Luminance noise, faded out in near-white areas so a #FFFFFF background stays pure white.
      const lum = (px[i] + px[i+1] + px[i+2]) / 3;
      const fade = lum > 245 ? 0 : lum > 225 ? (245 - lum) / 20 : 1;
      const n = (Math.random() + Math.random() - 1) * grain * fade;
      px[i] += n; px[i+1] += n; px[i+2] += n;
    }
    ctx.putImageData(id, 0, 0);
  }
  return c.toDataURL('image/jpeg', +$('quality').value);
}

async function reprocessAll() {
  for (const it of items) if (it.rawResult) it.finalUrl = await postProcess(it.rawResult);
  render();
}
$('exportSize').addEventListener('change', reprocessAll);
$('quality').addEventListener('change', reprocessAll);

/* ---------- batch runner ---------- */
let running = false;
$('runAll').addEventListener('click', async () => {
  if (running) return;
  const queue = items.filter(i => i.status === 'ready' || i.status === 'error');
  if (!queue.length) return alert('Nothing to process. Add images (or use Redo on a finished one).');
  if (!$('apiKey').value.trim()) return alert('Enter your Gemini API key at the top.');
  running = true; $('runAll').disabled = true;
  const workers = Array.from({ length: +$('concurrency').value }, async () => {
    while (queue.length) await enhance(queue.shift());
  });
  await Promise.all(workers);
  running = false; $('runAll').disabled = false;
});

$('clearAll').addEventListener('click', () => {
  if (items.some(i => i.status === 'working')) return alert('Wait for running jobs to finish.');
  items.length = 0; render();
});

$('downloadAll').addEventListener('click', async () => {
  const done = items.filter(i => i.finalUrl);
  if (!done.length) return alert('No finished images yet.');
  if (!window.JSZip) { done.forEach(downloadOne); return; }
  const zip = new JSZip();
  done.forEach(i => zip.file(`${i.name}_catalog.jpg`, i.finalUrl.split(',')[1], { base64: true }));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'catalog_images.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
});

function downloadOne(item) {
  const a = document.createElement('a'); a.href = item.finalUrl; a.download = `${item.name}_catalog.jpg`; a.click();
}

/* ---------- render ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function render() {
  const list = $('list');
  if (!items.length) { list.innerHTML = '<div class="empty">No images yet.</div>'; $('summary').textContent = ''; return; }
  const counts = items.reduce((a, i) => (a[i.status] = (a[i.status] || 0) + 1, a), {});
  $('summary').textContent = `${items.length} images · ${counts.done || 0} done · ${counts.working || 0} working · ${counts.error || 0} failed`;

  list.innerHTML = items.map(it => `
    <div class="card" data-id="${it.id}">
      <div class="card-head">
        <span class="name" title="${esc(it.name)}">${esc(it.name)}</span>
        <span class="status ${it.status}">${{ ready: 'Ready', working: 'Working…', done: 'Done', error: 'Failed' }[it.status]}</span>
      </div>
      <div class="pair">
        <figure><figcaption>Original</figcaption><div class="imgbox"><img src="${it.srcDataUrl}" alt="original"></div></figure>
        <figure><figcaption>Enhanced</figcaption><div class="imgbox">
          ${it.status === 'working' ? '<div class="spinner"></div>'
            : it.finalUrl ? `<img src="${it.finalUrl}" alt="enhanced">`
            : '<div class="placeholder">Not processed yet</div>'}
        </div></figure>
      </div>
      ${it.error ? `<div class="note err">${esc(it.error)}</div>` : ''}
      ${it.note && it.status === 'done' ? `<div class="note">Model note: ${esc(it.note)}</div>` : ''}
      <div class="card-actions">
        <button data-act="run" ${it.status === 'working' ? 'disabled' : ''}>${it.rawResult ? 'Redo' : 'Enhance'}</button>
        ${it.finalUrl ? `<button data-act="dl">Download</button>` : ''}
        ${it.rawResult ? `<input type="text" data-refine placeholder="Fix something… e.g. shadow lighter, keep logo sharp">
                          <button data-act="refine" ${it.status === 'working' ? 'disabled' : ''}>Refine</button>` : ''}
        <button data-act="remove" ${it.status === 'working' ? 'disabled' : ''} title="Remove">✕</button>
      </div>
    </div>`).join('');
}

$('list').addEventListener('click', (e) => {
  const img = e.target.closest('.imgbox img');
  if (img) { $('lightbox').querySelector('img').src = img.src; $('lightbox').style.display = 'flex'; return; }
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const card = btn.closest('.card'); const item = items.find(i => i.id === +card.dataset.id);
  const act = btn.dataset.act;
  if (act === 'run') enhance(item);
  if (act === 'dl') downloadOne(item);
  if (act === 'remove') { items.splice(items.indexOf(item), 1); render(); }
  if (act === 'refine') {
    const t = card.querySelector('[data-refine]').value.trim();
    if (!t) return card.querySelector('[data-refine]').focus();
    enhance(item, t);
  }
});
$('list').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-refine]')) e.target.closest('.card').querySelector('[data-act=refine]').click();
});
$('lightbox').addEventListener('click', () => { $('lightbox').style.display = 'none'; });
</script>
</body>
</html>
